debug-mode: false # enable debug particles

snapshot-refresh-interval: 12000 # ticks between chunk snapshot refresh, won't change without restart
engine-rate: 1 # 1 = every tick; 2 = every other tick; 3 = every third tick; etc.
recheck-interval: 20 # ticks between forced rechecks for visible entities

repair-meg-interval: 1200 # ticks between meg repair attempts
log-meg-repairs: false # log when meg entities are repaired
minimum-meg-radius: 48 # the minimum render radius meg entities should have, if it's below this, "repair" it and set to this
meg-rotation-locked: false # should meg entities have locked rotation? (not match the base entity rotation)
